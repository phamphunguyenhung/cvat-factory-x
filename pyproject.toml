[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-factory-x"
version = "0.1.0"
description = "CVAT Factory X — Data Release Control Tower for dataset contracts, snapshots, validation, lineage, and release governance."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pillow>=10.0",
    "numpy>=1.24",
    "mlflow>=2.10",
    "requests>=2.28",
]

[project.scripts]
cvat-release = "release_control.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["release_control*"]

[tool.setuptools.package-data]
release_control = ["contracts/*.yaml"]
